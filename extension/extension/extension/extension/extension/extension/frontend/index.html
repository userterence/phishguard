<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishGuard — Sign in</title>
  <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css)" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>PhishGuard<span>AI</span></h1>
    <p class="sub">Student-targeted phishing detection</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" class="form-control" required>
      <label>Password</label>
      <input type="password" id="password" class="form-control" required>
      <button class="btn btn-primary w-100 mt-3" type="submit">Sign in</button>
      <p id="err" class="text-danger mt-2"></p>
    </form>
    <p class="hint">Default admin: admin@phishguard.local / Admin@12345</p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
