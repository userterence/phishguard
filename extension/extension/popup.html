<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>PhishGuard</h1>
    <span id="roleBadge" class="badge">not signed in</span>
  </header>

  <section id="statusCard" class="status-card unknown">
    <div class="status-label" id="statusLabel">Checking...</div>
    <div class="category" id="categoryLabel"></div>
    <div class="confidence" id="confidenceLabel"></div>
    <ul id="reasonList"></ul>
  </section>

  <section class="report">
    <h2>Report this site</h2>
    <select id="reportCategory">
      <option value="academic">Academic phishing</option>
      <option value="scholarship">Scholarship phishing</option>
      <option value="account">Student account phishing</option>
      <option value="enrollment">Enrollment phishing</option>
    </select>
    <textarea id="reportDescription" placeholder="Optional description"></textarea>
    <button id="reportBtn">Submit report</button>
    <p id="reportMsg"></p>
  </section>

  <footer>
    <button id="openDashboard">Open dashboard</button>
    <button id="refresh">Rescan</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
