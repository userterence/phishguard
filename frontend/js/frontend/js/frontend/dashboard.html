<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishGuard Dashboard</title>
  <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css)" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">PhishGuard<span>AI</span></div>
    <div class="who">
      <strong id="userName"></strong>
      <small id="userRole"></small>
    </div>
    <nav id="nav"></nav>
    <button class="btn btn-sm btn-outline-light w-100 mt-3" onclick="logout()">Sign out</button>
  </aside>

  <main class="content">
    <header class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <button class="btn btn-sm btn-primary" id="connectExt">Connect extension</button>
    </header>

    <section id="cards" class="stat-grid"></section>

    <section class="panel">
      <h3>Detection trend</h3>
      <canvas id="trendChart" height="110"></canvas>
    </section>

    <section class="panel">
      <h3 id="tableTitle">Recent activity</h3>
      <div class="table-responsive"><table class="table table-dark table-sm" id="dataTable"></table></div>
    </section>

    <section class="panel" id="adminPanel" hidden>
      <h3>User management</h3>
      <form id="createUserForm" class="row g-2 mb-3">
        <div class="col-md-3"><input class="form-control" id="nuName" placeholder="Full name" required></div>
        <div class="col-md-3"><input class="form-control" id="nuEmail" type="email" placeholder="Email" required></div>
        <div class="col-md-2"><input class="form-control" id="nuPass" type="password" placeholder="Password" required></div>
        <div class="col-md-2">
          <select class="form-select" id="nuRole"><option>student</option><option>teacher</option></select>
        </div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Add user</button></div>
      </form>
      <div class="table-responsive"><table class="table table-dark table-sm" id="usersTable"></table></div>
    </section>

    <section class="panel" id="reportPanel">
      <h3>Report a suspicious site</h3>
      <form id="reportForm" class="row g-2">
        <div class="col-md-5"><input class="form-control" id="rUrl" placeholder="[suspicious-site.com](https://suspicious-site.com)" required></div>
        <div class="col-md-3">
          <select class="form-select" id="rCategory">
            <option value="academic">Academic</option>
            <option value="scholarship">Scholarship</option>
            <option value="account">Student account</option>
            <option value="enrollment">Enrollment</option>
          </select>
        </div>
        <div class="col-md-3"><input class="form-control" id="rDesc" placeholder="Optional description"></div>
        <div class="col-md-1"><button class="btn btn-primary w-100">Send</button></div>
      </form>
      <div class="table-responsive mt-3"><table class="table table-dark table-sm" id="reportsTable"></table></div>
    </section>

    <section class="panel" id="awarenessPanel">
      <h3>Cybersecurity awareness</h3>
      <div id="awarenessList" class="awareness"></div>
    </section>
  </main>
</div>

<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js)"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/charts.js"></script>
</body>
</html>
